{{define "content"}}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h1 class="h3 mb-0"><i class="bi bi-people me-2"></i>Characters</h1>
    <a href="/compose/design-sheet" class="btn btn-primary btn-sm">
        <i class="bi bi-plus-lg me-1"></i>デザインシートを生成
    </a>
</div>

<div class="row g-3">
    {{range .Data}}
    <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
        <a href="/characters/{{.ID}}" class="text-decoration-none">
            <article class="card h-100 shadow-sm comic-image-card">
                {{if .ThumbnailImageURL}}
                <img src="{{.ThumbnailImageURL}}" class="card-img-top" alt="{{.Name}}" loading="lazy">
                {{else}}
                <div class="card-img-top d-flex align-items-center justify-content-center text-muted py-5">
                    <i class="bi bi-person display-4"></i>
                </div>
                {{end}}
                <div class="card-body py-2">
                    <span class="fw-bold text-dark">{{.Name}}</span>
                    <code class="text-muted small d-block">{{.ID}}</code>
                </div>
            </article>
        </a>
    </div>
    {{else}}
    <div class="col-12">
        <div class="alert alert-light border text-center py-5 mb-0">
            <p class="mb-0">キャラクターが登録されていません。</p>
        </div>
    </div>
    {{end}}
</div>
{{end}}

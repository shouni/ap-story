{{define "content"}}
<div class="mb-4">
    <h1 class="h3 mb-1"><i class="bi bi-magic me-2"></i>漫画を生成</h1>
    <div class="text-muted small">原稿（URL またはテキスト）から章立て・ネーム・パネル・ページを一括生成します。</div>
</div>

{{if .Data.ErrorMessage}}
<div class="alert alert-danger" role="alert">
    <i class="bi bi-exclamation-triangle me-1"></i>{{.Data.ErrorMessage}}
</div>
{{end}}

<form method="post" action="/compose" class="card shadow-sm">
    <div class="card-body">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

        <div class="mb-3">
            <label for="source_url" class="form-label fw-bold">原稿 URL</label>
            <input type="url" class="form-control" id="source_url" name="source_url"
                   placeholder="https://example.com/article または gs://bucket/article.md"
                   value="{{.Data.SourceURL}}">
            <div class="form-text">記事や文書の URL（HTTP または GCS）。テキスト直接入力と排他です。</div>
        </div>

        <div class="mb-3">
            <label for="source_text" class="form-label fw-bold">原稿テキスト</label>
            <textarea class="form-control" id="source_text" name="source_text" rows="8"
                      placeholder="漫画にしたい文章を貼り付け">{{.Data.SourceText}}</textarea>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-12 col-md-6">
                <label for="script_mode" class="form-label fw-bold">台本モード</label>
                <input type="text" class="form-control" id="script_mode" name="script_mode"
                       placeholder="default（省略可）" value="{{.Data.ScriptMode}}">
            </div>
            <div class="col-12 col-md-6">
                <label for="style_mode" class="form-label fw-bold">スタイルモード</label>
                <input type="text" class="form-control" id="style_mode" name="style_mode"
                       placeholder="省略可" value="{{.Data.StyleMode}}">
            </div>
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="stop_after_script"
                   name="stop_after_script" value="1"{{if .Data.StopAfterScript}} checked{{end}}>
            <label class="form-check-label" for="stop_after_script">
                <span class="fw-bold">台本まで生成して確認する</span>
                <span class="d-block text-body-secondary small">
                    章立てとネームだけを先に作ります。内容を確かめてから、作品詳細の
                    「画像生成へ進む」で画像生成を開始できます。
                </span>
            </label>
        </div>

        <div class="d-grid d-sm-flex justify-content-sm-end gap-2">
            <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-send me-1"></i>生成を開始
            </button>
        </div>
    </div>
</form>
{{end}}
